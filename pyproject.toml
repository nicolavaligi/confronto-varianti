[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "confronto-varianti"
version = "0.1.0"
description = "Confronto GIS tra revisioni di un progetto su base particellare"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyogrio>=0.10", "pyproj>=3.7", "shapely>=2.1"]

[project.scripts]
confronto-varianti = "confronto_varianti:main"

[tool.setuptools]
py-modules = ["confronto_varianti"]
